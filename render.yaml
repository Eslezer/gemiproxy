services:
  - type: web
    name: janitor-ai-proxy
    env: python
    # IMPORTANT: Google Gemini API is geo-blocked in several regions (e.g. Frankfurt,
    # Singapore). Pin to a US region so requests to generativelanguage.googleapis.com
    # are accepted. Valid options: oregon, ohio, virginia.
    region: oregon
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT main:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL
        value: gemini-2.5-pro
      - key: ENABLE_NSFW
        value: true
      - key: ENABLE_THINKING
        value: true
      - key: DISPLAY_THINKING_IN_CONSOLE
        value: true
      - key: ENABLE_GOOGLE_SEARCH
        value: false
